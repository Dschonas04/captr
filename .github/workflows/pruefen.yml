name: prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dienst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          nicht_formatiert=$(gofmt -l .)
          if [ -n "$nicht_formatiert" ]; then echo "$nicht_formatiert"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  oberflaeche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npx tsc --noEmit -p .
      - run: npx vite build

  abbild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [dienst, oberflaeche]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t captr:test .
      - name: startet und antwortet
        run: |
          docker run -d --name captr -p 8080:8080 captr:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/status && exit 0; sleep 1; done
          docker logs captr; exit 1
